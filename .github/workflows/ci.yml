name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Committed skill schemas match the primitives
        run: |
          if [ -n "$(git status --porcelain -- skill/)" ]; then
            git status --short -- skill/
            echo "::error::skill/ differs from what npm run skill writes: run it and commit the result"
            exit 1
          fi
