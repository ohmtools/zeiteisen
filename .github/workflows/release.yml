name: Release

# Runs when a version tag is pushed (`npm run release` tags the version in
# package.json). Releases are immutable once published, so this workflow
# creates the release itself and publishes it last:
# 1. lint, tests, build; the build as a ZIP on a draft release
# 2. the container image (build + static-web-server) on the GitHub Container
#    Registry as ghcr.io/<owner>/<repo>
# 3. publishes the release
# A tag with a hyphen (v1.3.0-rc.1) is a pre-release: no "latest" image.
# The repository variable VITE_SITE_URL (e.g. https://zeiteisen.example.org)
# gives the ZIP's link previews their image. The image takes it at runtime
# instead (SITE_URL, see container-start.sh).
on:
  push:
    tags: ["v*"]

jobs:
  assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Tag matches the version in package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$TAG" ]; then
            echo "::error::Tag $TAG, but package.json has $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      - name: Draft the release with the build as a ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          name="${GITHUB_REPOSITORY#*/}-${TAG//\//-}.zip"
          (cd dist && zip -qr9 "../$name" .)
          sha256sum "$name" > "$name.sha256"
          pre=""
          [[ "$TAG" == *-* ]] && pre="--prerelease"
          gh release create "$TAG" "$name" "$name.sha256" --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --title "$TAG" --generate-notes $pre

  image:
    # Publish only after lint and tests above passed
    needs: assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 -> tags v1.2.3, 1.2.3, 1.2; "latest" only for regular releases (no pre-release)
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No provenance attestation: otherwise ghcr lists index, image and attestation as
          # three versions
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    # Last: the release only appears once ZIP and image both exist
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
