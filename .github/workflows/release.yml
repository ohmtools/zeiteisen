name: Release

# Runs once a release is published on GitHub:
# 1. builds the app and attaches it to the release as a ZIP
# 2. builds the container image (build + static-web-server) and publishes it
#    to the GitHub Container Registry as ghcr.io/<owner>/<repo>
# The repository variable VITE_SITE_URL (e.g. https://zeiteisen.example.org)
# gives the ZIP's link previews their image. The image takes it at runtime
# instead (SITE_URL, see container-start.sh).
on:
  release:
    types: [published]

jobs:
  assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      - name: Pack the build and attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          name="${GITHUB_REPOSITORY#*/}-${TAG//\//-}.zip"
          (cd dist && zip -qr9 "../$name" .)
          sha256sum "$name" > "$name.sha256"
          gh release upload "$TAG" "$name" "$name.sha256" --repo "$GITHUB_REPOSITORY" --clobber

  image:
    # Publish only after lint and tests above passed
    needs: assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 -> tags v1.2.3, 1.2.3, 1.2; "latest" only for regular releases (no pre-release)
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ !github.event.release.prerelease }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
