<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Flat, in the app's colours: OLED black, white, the red accent and
       orange (the Pr kind's border in the dark theme). -->

  <!-- Squircle backdrop -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="#000000"/>
  <rect x="0.75" y="0.75" width="510.5" height="510.5" rx="111.3" ry="111.3" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Pocket watch glyph -->
  <g>
    <!-- Winding stem -->
    <rect x="244" y="112" width="24" height="30" rx="7" fill="#FAFAFA"/>
    <!-- Crown / chain loop -->
    <circle cx="256" cy="100" r="20" fill="none" stroke="#FAFAFA" stroke-width="18"/>
    <!-- Bezel & face -->
    <circle cx="256" cy="288" r="144" fill="#0A0A0A" stroke="#FAFAFA" stroke-width="22"/>
    <!-- Timetable grid: centered, sized to clear the inner ring edge -->
    <rect x="174" y="202" width="70" height="80" rx="12" fill="#DC2626"/>
    <rect x="174" y="294" width="70" height="80" rx="12" fill="#FAFAFA"/>
    <rect x="258" y="202" width="80" height="172" rx="12" fill="#F97316"/>
  </g>
</svg>
