<svg xmlns="http://www.w3.org/2000/svg" viewBox="64 64 384 384" width="512" height="512">
  <!-- `logo.svg` without its backdrop. A black halo behind the white parts
       keeps them readable on light tab strips. -->

  <!-- Pocket watch glyph -->
  <g>
    <!-- Halo -->
    <rect x="236" y="104" width="40" height="46" rx="12" fill="#000000"/>
    <circle cx="256" cy="100" r="20" fill="none" stroke="#000000" stroke-width="34"/>
    <circle cx="256" cy="288" r="160" fill="#000000"/>
    <!-- Winding stem -->
    <rect x="244" y="112" width="24" height="30" rx="7" fill="#FAFAFA"/>
    <!-- Crown / chain loop -->
    <circle cx="256" cy="100" r="20" fill="none" stroke="#FAFAFA" stroke-width="18"/>
    <!-- Bezel & face -->
    <circle cx="256" cy="288" r="144" fill="#0A0A0A" stroke="#FAFAFA" stroke-width="22"/>
    <!-- Timetable grid: centered, sized to clear the inner ring edge -->
    <rect x="174" y="202" width="70" height="80" rx="12" fill="#DC2626"/>
    <rect x="174" y="294" width="70" height="80" rx="12" fill="#FAFAFA"/>
    <rect x="258" y="202" width="80" height="172" rx="12" fill="#F97316"/>
  </g>
</svg>
