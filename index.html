<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <!-- Set shadcn's .dark class before first paint so dark users never see a
         white flash on load or on a locale switch (setLocale reloads).
         ThemeProvider keeps it in sync afterwards. -->
    <script>
      document.documentElement.classList.toggle(
        "dark",
        matchMedia("(prefers-color-scheme: dark)").matches,
      );
    </script>
    <title>Zeiteisen</title>
    <!-- Link preview card (WhatsApp, Discord, …): crawlers read these tags
         from the raw HTML, no JS. German only, one card per URL. The
         `og-share` block of `vite.config.ts` swaps them for `dist/s/`. -->
    <meta name="description" content="Stundenplan-Kombinationen ausprobieren" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zeiteisen" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Zeiteisen" />
    <meta property="og:description" content="Stundenplan-Kombinationen ausprobieren" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Zeiteisen: Stundenplan App für die Schule"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
